name: Universal Fork Sync

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: universal-fork-sync
  cancel-in-progress: false

jobs:
  sync-all-forks:
    name: Find and force-sync all forks
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Verify token
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}
        run: |
          set -euo pipefail
          gh auth status
          owner="$(gh api user --jq '.login')"
          if [[ -z "$owner" ]]; then
            echo "::error::The token could not identify your GitHub account."
            exit 1
          fi
          echo "Authenticated as: $owner"

      - name: Check classic token scopes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}
        run: |
          set -euo pipefail
          headers="$(gh api --include user 2>/dev/null | tr -d '\r')"
          scopes="$(printf '%s\n' "$headers" | awk -F': ' 'tolower($1) == "x-oauth-scopes" { print $2 }')"
          echo "Token scopes: ${scopes:-none}"

          normalized=",${scopes// /},"

          if [[ "$normalized" != *",repo,"* &&
                "$normalized" != *",public_repo,"* ]]; then
            echo "::error::The token is missing repo or public_repo."
            exit 1
          fi

          if [[ "$normalized" != *",workflow,"* ]]; then
            echo "::error::The token is missing workflow."
            exit 1
          fi

      - name: Sync forks and trigger portable builders
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}
        run: |
          set -uo pipefail

          owner="$(gh api user --jq '.login')"

          mapfile -t forks < <(
            gh repo list "$owner" \
              --fork \
              --no-archived \
              --limit 1000 \
              --json nameWithOwner \
              --jq '.[].nameWithOwner'
          )

          if (( ${#forks[@]} == 0 )); then
            echo "No active forks were found."
            exit 0
          fi

          successes=0
          failures=0

          zyntax_changed=0
          gemtype_changed=0
          pake_changed=0
          yasb_changed=0
          brave_free_origin_changed=0
          komorebi_bundle_changed=0
          telegram_drive_changed=0

          for repository in "${forks[@]}"; do
            echo "::group::Syncing $repository"

            default_branch="$(gh api "repos/$repository" --jq '.default_branch' 2>/dev/null)"
            before_sha="$(gh api "repos/$repository/commits/$default_branch" --jq '.sha' 2>/dev/null)"

            if gh repo sync "$repository" --force; then
              successes=$((successes + 1))
              after_sha="$(gh api "repos/$repository/commits/$default_branch" --jq '.sha' 2>/dev/null)"

              echo "Before: ${before_sha:-unknown}"
              echo "After:  ${after_sha:-unknown}"

              if [[ -n "$before_sha" &&
                    -n "$after_sha" &&
                    "$before_sha" != "$after_sha" ]]; then

                case "${repository#*/}" in
                  ZyntaxAI)
                    zyntax_changed=1
                    ;;
                  GemType)
                    gemtype_changed=1
                    ;;
                  Pake)
                    pake_changed=1
                    ;;
                  yasb)
                    yasb_changed=1
                    ;;
                  Brave-Free-Origin)
                    brave_free_origin_changed=1
                    ;;
                  komorebi|whkd)
                    komorebi_bundle_changed=1
                    ;;
                  Telegram-Drive)
                    telegram_drive_changed=1
                    ;;
                esac
              fi
            else
              echo "::error::Failed to sync: $repository"
              failures=$((failures + 1))
            fi

            echo "::endgroup::"
          done

          trigger_standard_builder() {
            local builder="$1"
            local source_repo="$2"
            local source_ref="$3"

            echo "Triggering $owner/$builder from $source_repo@$source_ref"

            if ! gh workflow run build-portable.yml \
                  --repo "$owner/$builder" \
                  --ref main \
                  --raw-field mode=portable-data \
                  --raw-field upstream_repo="$source_repo" \
                  --raw-field upstream_ref="$source_ref"; then
              echo "::error::Could not trigger $builder"
              failures=$((failures + 1))
            fi
          }

          if (( zyntax_changed )); then
            ref="$(gh api "repos/$owner/ZyntaxAI" --jq '.default_branch')"
            trigger_standard_builder "ZyntaxAI-Portable-Builder" "$owner/ZyntaxAI" "$ref"
          fi

          if (( gemtype_changed )); then
            ref="$(gh api "repos/$owner/GemType" --jq '.default_branch')"
            trigger_standard_builder "GemType-Portable-Builder" "$owner/GemType" "$ref"
          fi

          # Pake is a builder for multiple saved apps, so use rebuild-saved
          # instead of the standard portable-data mode.
          if (( pake_changed )); then
            ref="$(gh api "repos/$owner/Pake" --jq '.default_branch')"

            echo "Triggering $owner/Pake-Portable-Builder from $owner/Pake@$ref"

            if ! gh workflow run build-portable.yml \
                  --repo "$owner/Pake-Portable-Builder" \
                  --ref main \
                  --raw-field mode=rebuild-saved \
                  --raw-field upstream_repo="$owner/Pake" \
                  --raw-field upstream_ref="$ref"; then
              echo "::error::Could not trigger Pake-Portable-Builder"
              failures=$((failures + 1))
            fi
          fi

          if (( yasb_changed )); then
            ref="$(gh api "repos/$owner/yasb" --jq '.default_branch')"
            trigger_standard_builder "YASB-Portable-Builder" "$owner/yasb" "$ref"
          fi

          # Brave Free Origin's builder uses source_repo/source_ref rather than
          # the upstream_repo/upstream_ref fields used by the standard builders.
          if (( brave_free_origin_changed )); then
            ref="$(gh api "repos/$owner/Brave-Free-Origin" --jq '.default_branch')"

            echo "Triggering $owner/Brave-Free-Origin-Portable-Builder from $owner/Brave-Free-Origin@$ref"

            if ! gh workflow run build-portable.yml \
                  --repo "$owner/Brave-Free-Origin-Portable-Builder" \
                  --ref main \
                  --raw-field mode=portable-data \
                  --raw-field source_repo="$owner/Brave-Free-Origin" \
                  --raw-field source_ref="$ref"; then
              echo "::error::Could not trigger Brave-Free-Origin-Portable-Builder"
              failures=$((failures + 1))
            fi
          fi

          # komorebi and whkd are one portable bundle. Trigger once if either changed.
          if (( komorebi_bundle_changed )); then
            komorebi_ref="$(gh api "repos/$owner/komorebi" --jq '.default_branch')"
            whkd_ref="$(gh api "repos/$owner/whkd" --jq '.default_branch')"

            echo "Triggering private Komorebi bundle builder"

            if ! gh workflow run build-portable.yml \
                  --repo "$owner/Komorebi-Portable-Builder" \
                  --ref main \
                  --raw-field mode=portable-data \
                  --raw-field komorebi_repo="$owner/komorebi" \
                  --raw-field komorebi_ref="$komorebi_ref" \
                  --raw-field whkd_repo="$owner/whkd" \
                  --raw-field whkd_ref="$whkd_ref"; then
              echo "::error::Could not trigger Komorebi-Portable-Builder"
              failures=$((failures + 1))
            fi
          fi

          # Telegram Drive Phase 1 uses filesystem-portable, NOT portable-data.
          # All other builder modes remain unchanged.
          if (( telegram_drive_changed )); then
            ref="$(gh api "repos/$owner/Telegram-Drive" --jq '.default_branch')"

            echo "Triggering $owner/Telegram-Drive-Portable-Builder from $owner/Telegram-Drive@$ref"

            if ! gh workflow run build-portable.yml \
                  --repo "$owner/Telegram-Drive-Portable-Builder" \
                  --ref main \
                  --raw-field mode=filesystem-portable \
                  --raw-field upstream_repo="$owner/Telegram-Drive" \
                  --raw-field upstream_ref="$ref"; then
              echo "::error::Could not trigger Telegram-Drive-Portable-Builder"
              failures=$((failures + 1))
            fi
          fi

          echo
          echo "Synchronization summary"
          echo "-----------------------"
          echo "Forks found: ${#forks[@]}"
          echo "Successful syncs: $successes"
          echo "Failures: $failures"
          echo "ZyntaxAI changed: $zyntax_changed"
          echo "GemType changed: $gemtype_changed"
          echo "Pake changed: $pake_changed"
          echo "YASB changed: $yasb_changed"
          echo "Brave Free Origin changed: $brave_free_origin_changed"
          echo "Komorebi/whkd bundle changed: $komorebi_bundle_changed"
          echo "Telegram Drive changed: $telegram_drive_changed"

          if (( failures > 0 )); then
            exit 1
          fi
