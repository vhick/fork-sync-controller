name: Universal Fork Sync

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: universal-fork-sync
  cancel-in-progress: false

jobs:
  sync-all-forks:
    name: Find and force-sync all forks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Verify token
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}
        run: |
          set -euo pipefail

          echo "Checking GitHub authentication..."
          gh auth status

          owner="$(gh api user --jq '.login')"

          if [[ -z "$owner" ]]; then
            echo "::error::The token could not identify your GitHub account."
            exit 1
          fi

          echo "Authenticated as: $owner"

      - name: Check classic token scopes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}
        run: |
          set -euo pipefail

          headers="$(gh api --include user 2>/dev/null | tr -d '\r')"

          scopes="$(
            printf '%s\n' "$headers" |
            awk -F': ' 'tolower($1) == "x-oauth-scopes" { print $2 }'
          )"

          echo "Token scopes reported by GitHub: ${scopes:-none}"

          if [[ -z "$scopes" ]]; then
            echo "::error::No classic token scopes were detected."
            echo "::error::FORK_SYNC_TOKEN should contain a classic PAT."
            exit 1
          fi

          normalized=",${scopes// /},"

          if [[ "$normalized" != *",repo,"* &&
                "$normalized" != *",public_repo,"* ]]; then
            echo "::error::The token is missing repo or public_repo."
            exit 1
          fi

          if [[ "$normalized" != *",workflow,"* ]]; then
            echo "::error::The token is missing workflow."
            exit 1
          fi

          echo "Required scopes are present."

      - name: Find, sync forks, and trigger portable builders when changed
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}
        run: |
          set -uo pipefail

          owner="$(gh api user --jq '.login')"

          echo "Searching for non-archived forks owned by $owner..."

          mapfile -t forks < <(
            gh repo list "$owner" \
              --fork \
              --no-archived \
              --limit 1000 \
              --json nameWithOwner \
              --jq '.[].nameWithOwner'
          )

          fork_count="${#forks[@]}"

          if (( fork_count == 0 )); then
            echo "No active forks were found."
            exit 0
          fi

          successes=0
          failures=0
          portable_changes=0
          portable_triggers=0

          trigger_portable_builder() {
            local repository="$1"
            local default_branch="$2"
            local fork_name="${repository#*/}"
            local builder_name=""
            local workflow_file="build-portable.yml"

            case "$fork_name" in
              ZyntaxAI)
                builder_name="ZyntaxAI-Portable-Builder"
                ;;
              GemType)
                builder_name="GemType-Portable-Builder"
                ;;
              yasb)
                builder_name="YASB-Portable-Builder"
                ;;
              *)
                return 0
                ;;
            esac

            portable_changes=$((portable_changes + 1))
            builder_repo="$owner/$builder_name"

            echo "$fork_name changed."
            echo "Triggering: $builder_repo"

            if gh workflow run "$workflow_file" \
                  --repo "$builder_repo" \
                  --ref main \
                  --raw-field mode=portable-data \
                  --raw-field upstream_repo="$repository" \
                  --raw-field upstream_ref="$default_branch"; then

              echo "Portable build triggered successfully."
              portable_triggers=$((portable_triggers + 1))
            else
              echo "::error::$fork_name synced, but $builder_repo could not be triggered."
              echo "::error::Confirm $builder_repo contains .github/workflows/$workflow_file"
              failures=$((failures + 1))
            fi
          }

          echo "Found $fork_count fork(s)."
          echo

          for repository in "${forks[@]}"; do
            echo "::group::Syncing $repository"

            default_branch="$(
              gh api "repos/$repository" --jq '.default_branch' 2>/dev/null
            )"

            if [[ -z "$default_branch" ]]; then
              echo "::error::Could not determine default branch for $repository"
              failures=$((failures + 1))
              echo "::endgroup::"
              continue
            fi

            before_sha="$(
              gh api "repos/$repository/commits/$default_branch" --jq '.sha' 2>/dev/null
            )"

            echo "Default branch: $default_branch"
            echo "Before sync:    ${before_sha:-unknown}"

            if gh repo sync "$repository" --force; then
              successes=$((successes + 1))
              echo "Successfully synced: $repository"

              after_sha="$(
                gh api "repos/$repository/commits/$default_branch" --jq '.sha' 2>/dev/null
              )"

              echo "After sync:     ${after_sha:-unknown}"

              if [[ -n "$before_sha" &&
                    -n "$after_sha" &&
                    "$before_sha" != "$after_sha" ]]; then
                trigger_portable_builder "$repository" "$default_branch"
              else
                case "${repository#*/}" in
                  ZyntaxAI|GemType|yasb)
                    echo "${repository#*/} has no new commit. Portable build not needed."
                    ;;
                esac
              fi
            else
              echo "::error::Failed to sync: $repository"
              failures=$((failures + 1))
            fi

            echo "::endgroup::"
          done

          echo
          echo "Synchronization summary"
          echo "-----------------------"
          echo "Forks found:                $fork_count"
          echo "Successful syncs:           $successes"
          echo "Portable fork changes:      $portable_changes"
          echo "Portable builders triggered:$portable_triggers"
          echo "Failures:                   $failures"

          if (( failures > 0 )); then
            exit 1
          fi
