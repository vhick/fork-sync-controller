name: Universal Fork Sync

on:
  schedule:
    # Run every 6 hours, at 17 minutes past the hour.
    - cron: "17 */6 * * *"

  # Adds a manual "Run workflow" button.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: universal-fork-sync
  cancel-in-progress: false

jobs:
  sync-all-forks:
    name: Find and force-sync all forks
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Verify token
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}
        run: |
          set -euo pipefail

          echo "Checking GitHub authentication..."
          gh auth status

          owner="$(gh api user --jq '.login')"

          if [[ -z "$owner" ]]; then
            echo "::error::The token could not identify your GitHub account."
            exit 1
          fi

          echo "Authenticated as: $owner"

      - name: Check classic token scopes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}
        run: |
          set -euo pipefail

          headers="$(gh api --include user 2>/dev/null | tr -d '\r')"

          scopes="$(
            printf '%s\n' "$headers" |
            awk -F': ' 'tolower($1) == "x-oauth-scopes" { print $2 }'
          )"

          echo "Token scopes reported by GitHub: ${scopes:-none}"

          if [[ -z "$scopes" ]]; then
            echo "::error::No classic token scopes were detected."
            echo "::error::FORK_SYNC_TOKEN should contain a classic personal access token beginning with ghp_."
            exit 1
          fi

          normalized=",${scopes// /},"

          if [[ "$normalized" != *",repo,"* &&
                "$normalized" != *",public_repo,"* ]]; then
            echo "::error::The token is missing the repo or public_repo scope."
            exit 1
          fi

          if [[ "$normalized" != *",workflow,"* ]]; then
            echo "::error::The token is missing the workflow scope."
            exit 1
          fi

          echo "The required repository and workflow scopes are present."

      - name: Find forks, sync them, and trigger portable builders
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}

          # Existing ZyntaxAI integration.
          ZYNTAX_FORK_NAME: ZyntaxAI
          ZYNTAX_BUILDER_NAME: ZyntaxAI-Portable-Builder
          ZYNTAX_BUILDER_WORKFLOW: build-portable.yml

          # Komorebi true-portable integration.
          KOMOREBI_FORK_NAME: komorebi
          WHKD_FORK_NAME: whkd
          KOMOREBI_BUILDER_NAME: Komorebi-Portable-Builder
          KOMOREBI_BUILDER_WORKFLOW: build-portable.yml

        run: |
          set -uo pipefail

          owner="$(gh api user --jq '.login')"

          echo "Searching for non-archived forks owned by $owner..."

          mapfile -t forks < <(
            gh repo list "$owner" \
              --fork \
              --no-archived \
              --limit 1000 \
              --json nameWithOwner \
              --jq '.[].nameWithOwner'
          )

          fork_count="${#forks[@]}"

          if (( fork_count == 0 )); then
            echo "No active forks were found."
            exit 0
          fi

          echo "Found $fork_count fork(s)."
          echo

          successes=0
          failures=0

          zyntax_changed=0
          komorebi_changed=0
          whkd_changed=0

          for repository in "${forks[@]}"; do
            echo "::group::Syncing $repository"

            default_branch="$(
              gh api "repos/$repository" --jq '.default_branch' 2>/dev/null
            )"

            if [[ -z "$default_branch" ]]; then
              echo "::error::Could not determine default branch for $repository"
              failures=$((failures + 1))
              echo "::endgroup::"
              continue
            fi

            before_sha="$(
              gh api "repos/$repository/commits/$default_branch" --jq '.sha' 2>/dev/null
            )"

            echo "Default branch: $default_branch"
            echo "Before sync:    ${before_sha:-unknown}"

            if gh repo sync "$repository" --force; then
              successes=$((successes + 1))

              after_sha="$(
                gh api "repos/$repository/commits/$default_branch" --jq '.sha' 2>/dev/null
              )"

              echo "After sync:     ${after_sha:-unknown}"

              if [[ -n "$before_sha" &&
                    -n "$after_sha" &&
                    "$before_sha" != "$after_sha" ]]; then

                echo "New upstream commit detected."

                repo_name="${repository#*/}"

                if [[ "${repo_name,,}" == "${ZYNTAX_FORK_NAME,,}" ]]; then
                  zyntax_changed=1
                fi

                if [[ "${repo_name,,}" == "${KOMOREBI_FORK_NAME,,}" ]]; then
                  komorebi_changed=1
                fi

                if [[ "${repo_name,,}" == "${WHKD_FORK_NAME,,}" ]]; then
                  whkd_changed=1
                fi
              else
                echo "Already up to date."
              fi
            else
              echo "::error::Failed to sync: $repository"
              failures=$((failures + 1))
            fi

            echo "::endgroup::"
          done

          echo
          echo "Portable build trigger phase"
          echo "----------------------------"

          # Preserve the ZyntaxAI automation if that builder exists.
          if (( zyntax_changed == 1 )); then
            builder="$owner/$ZYNTAX_BUILDER_NAME"

            if gh repo view "$builder" >/dev/null 2>&1; then
              echo "Triggering ZyntaxAI portable builder..."

              if ! gh workflow run "$ZYNTAX_BUILDER_WORKFLOW" \
                    --repo "$builder" \
                    --ref main \
                    --raw-field mode=portable-data \
                    --raw-field upstream_repo="$owner/$ZYNTAX_FORK_NAME" \
                    --raw-field upstream_ref=main; then
                echo "::error::Could not trigger $builder"
                failures=$((failures + 1))
              fi
            else
              echo "::warning::$builder does not exist; ZyntaxAI build trigger skipped."
            fi
          fi

          # Komorebi and whkd are built as one portable package.
          # Trigger ONCE if either clean fork changed during this sync run.
          if (( komorebi_changed == 1 || whkd_changed == 1 )); then
            builder="$owner/$KOMOREBI_BUILDER_NAME"

            if gh repo view "$builder" >/dev/null 2>&1; then
              echo "Triggering Komorebi + whkd portable builder..."

              if ! gh workflow run "$KOMOREBI_BUILDER_WORKFLOW" \
                    --repo "$builder" \
                    --ref main \
                    --raw-field mode=portable-data \
                    --raw-field komorebi_repo="$owner/$KOMOREBI_FORK_NAME" \
                    --raw-field komorebi_ref=master \
                    --raw-field whkd_repo="$owner/$WHKD_FORK_NAME" \
                    --raw-field whkd_ref=master; then
                echo "::error::Could not trigger $builder"
                failures=$((failures + 1))
              fi
            else
              echo "::warning::$builder does not exist; Komorebi build trigger skipped."
            fi
          fi

          echo
          echo "Synchronization summary"
          echo "-----------------------"
          echo "Forks found:        $fork_count"
          echo "Successful syncs:   $successes"
          echo "Failures:           $failures"
          echo "ZyntaxAI changed:   $zyntax_changed"
          echo "komorebi changed:   $komorebi_changed"
          echo "whkd changed:       $whkd_changed"

          if (( failures > 0 )); then
            exit 1
          fi
