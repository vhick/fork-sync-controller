name: Universal Fork Sync

# MIRROR MODE: automatically overwrite shared fork branches with upstream source.
# The controller does not dispatch any portable builders.
# IMPORTANT: custom files/commits on a mirrored branch can be removed, including
# .github/workflows files. Keep portable builders in separate repositories.
on:
  schedule:
    # Every six hours (UTC), as in the original controller.
    - cron: '17 */6 * * *'
  workflow_dispatch:

# All fork access comes from the existing FORK_SYNC_TOKEN secret.
permissions:
  contents: read

concurrency:
  group: universal-fork-sync
  cancel-in-progress: false

jobs:
  sync-forks:
    name: Automatically discover and force-sync all my forks
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}

    steps:
      - name: Discover forks and mirror their shared upstream branches
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo '::error::FORK_SYNC_TOKEN secret is missing.'
            exit 1
          fi
          gh auth status >/dev/null
          owner="$(gh api user --jq '.login')"
          if [[ -z "$owner" ]]; then
            echo '::error::Cannot identify the GitHub account for FORK_SYNC_TOKEN.'
            exit 1
          fi

          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          # Auto-discover all active, accessible forks belonging to this account.
          # Pagination means new forks require no changes to this YAML.
          gh api --paginate 'user/repos?affiliation=owner&per_page=100' \
            --jq '.[] | select(.fork == true and .archived == false and .disabled == false) | .full_name' \
            > "$tmp/forks.txt"
          total="$(wc -l < "$tmp/forks.txt" | tr -d ' ')"

          echo "GitHub account: $owner"
          echo "Active forks found: $total"
          echo 'Mode: force mirror (--force always enabled)'

          {
            echo '## Universal Fork Sync — Force Mirror'
            echo ''
            echo "- GitHub account: \`$owner\`"
            echo "- Active forks discovered: **$total**"
            echo '- Sync mode: **Force mirror (overwrite fork branch changes)**'
            echo '- Portable builders dispatched by this controller: **0**'
            echo ''
            echo '| Fork | Original developer repo | Mirrored branches | Failed branches | Result |'
            echo '|---|---|---:|---:|---|'
          } >> "$GITHUB_STEP_SUMMARY"

          if (( total == 0 )); then
            echo 'No accessible, active forks were found.'
            exit 0
          fi

          repos_ok=0
          repos_failed=0
          branches_ok=0
          branches_failed=0

          while IFS= read -r fork; do
            [[ -n "$fork" ]] || continue
            echo "::group::Fork $fork"

            # Always discover the parent; never hard-code repo names.
            if ! upstream="$(gh api "repos/$fork" --jq '.parent.full_name // empty')"; then
              echo "::error::Cannot inspect parent repository for $fork."
              repos_failed=$((repos_failed + 1))
              echo "| \`$fork\` | Unknown | 0 | 1 | Failed: parent lookup |" >> "$GITHUB_STEP_SUMMARY"
              echo '::endgroup::'
              continue
            fi
            if [[ -z "$upstream" ]]; then
              echo "::error::Original developer repository for $fork is unavailable."
              repos_failed=$((repos_failed + 1))
              echo "| \`$fork\` | Unavailable | 0 | 1 | Failed: parent unavailable |" >> "$GITHUB_STEP_SUMMARY"
              echo '::endgroup::'
              continue
            fi

            # Mirror only branches that exist in BOTH repos. This automatically
            # handles main, master, develop and other shared branch names.
            # Fork-only builder branches are left alone.
            if ! gh api --paginate "repos/$fork/branches?per_page=100" \
                  --jq '.[].name' > "$tmp/fork-branches.txt" || \
               ! gh api --paginate "repos/$upstream/branches?per_page=100" \
                  --jq '.[].name' > "$tmp/upstream-branches.txt"; then
              echo "::error::Cannot list branches for $fork or $upstream."
              repos_failed=$((repos_failed + 1))
              echo "| \`$fork\` | \`$upstream\` | 0 | 1 | Failed: branch listing |" >> "$GITHUB_STEP_SUMMARY"
              echo '::endgroup::'
              continue
            fi
            comm -12 \
              <(LC_ALL=C sort -u "$tmp/fork-branches.txt") \
              <(LC_ALL=C sort -u "$tmp/upstream-branches.txt") \
              > "$tmp/shared-branches.txt"

            mirrored=0
            failed=0
            while IFS= read -r branch; do
              [[ -n "$branch" ]] || continue
              echo "Mirroring $fork @ $branch from $upstream (force overwrite enabled) ..."

              # Hard reset the fork branch to the upstream branch; this also
              # fixes the divergent vhick/Pake branch if GitHub permits the push.
              if gh repo sync "$fork" --source "$upstream" --branch "$branch" --force; then
                mirrored=$((mirrored + 1))
              else
                echo "::error::Unable to mirror $fork @ $branch. Check token permissions and branch rules."
                failed=$((failed + 1))
              fi
            done < "$tmp/shared-branches.txt"

            if (( mirrored == 0 && failed == 0 )); then
              echo "::warning::No common branches for $fork and $upstream."
              result='Skipped: no common branch'
              repos_failed=$((repos_failed + 1))
            elif (( failed > 0 )); then
              result='Partial / failed'
              repos_failed=$((repos_failed + 1))
            else
              result='OK'
              repos_ok=$((repos_ok + 1))
            fi

            branches_ok=$((branches_ok + mirrored))
            branches_failed=$((branches_failed + failed))
            echo "| \`$fork\` | \`$upstream\` | $mirrored | $failed | $result |" >> "$GITHUB_STEP_SUMMARY"
            echo '::endgroup::'
          done < "$tmp/forks.txt"

          {
            echo ''
            echo "**Results:** $repos_ok forks OK, $repos_failed forks with issues; $branches_ok branches mirrored/checked, $branches_failed failed branch syncs."
            echo ''
            echo 'Only branches present in both the fork and parent are mirrored. Fork-only branches, new upstream-only branches, and tags are not synced.'
            echo ''
            echo 'The controller does not dispatch portable-builder workflows. However, PAT-authored pushes CAN trigger workflows listening to `push`.'
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Forks OK: $repos_ok; forks with issues: $repos_failed"
          echo "Branches mirrored/checked: $branches_ok; errors: $branches_failed"
          if (( repos_failed > 0 )); then
            exit 1
          fi
