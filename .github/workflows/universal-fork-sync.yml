name: Universal Fork Sync

on:
  schedule:
    # Run every 6 hours, at 17 minutes past the hour.
    - cron: "17 */6 * * *"

  # Adds a manual "Run workflow" button.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: universal-fork-sync
  cancel-in-progress: false

jobs:
  sync-all-forks:
    name: Find and force-sync all forks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Verify token
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}
        run: |
          set -euo pipefail

          echo "Checking GitHub authentication..."

          gh auth status

          owner="$(gh api user --jq '.login')"

          if [[ -z "$owner" ]]; then
            echo "::error::The token could not identify your GitHub account."
            exit 1
          fi

          echo "Authenticated as: $owner"

      - name: Check classic token scopes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}
        run: |
          set -euo pipefail

          headers="$(gh api --include user 2>/dev/null | tr -d '\r')"

          scopes="$(
            printf '%s\n' "$headers" |
            awk -F': ' 'tolower($1) == "x-oauth-scopes" { print $2 }'
          )"

          echo "Token scopes reported by GitHub: ${scopes:-none}"

          if [[ -z "$scopes" ]]; then
            echo "::error::No classic token scopes were detected."
            echo "::error::FORK_SYNC_TOKEN should contain a classic personal access token beginning with ghp_."
            exit 1
          fi

          normalized=",${scopes// /},"

          if [[ "$normalized" != *",repo,"* &&
                "$normalized" != *",public_repo,"* ]]; then
            echo "::error::The token is missing the repo or public_repo scope."
            exit 1
          fi

          if [[ "$normalized" != *",workflow,"* ]]; then
            echo "::error::The token is missing the workflow scope."
            exit 1
          fi

          echo "The required repository and workflow scopes are present."

      - name: Find and sync forks
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}
        run: |
          set -uo pipefail

          owner="$(gh api user --jq '.login')"

          echo "Searching for non-archived forks owned by $owner..."

          mapfile -t forks < <(
            gh repo list "$owner" \
              --fork \
              --no-archived \
              --limit 1000 \
              --json nameWithOwner \
              --jq '.[].nameWithOwner'
          )

          fork_count="${#forks[@]}"

          if (( fork_count == 0 )); then
            echo "No active forks were found."
            exit 0
          fi

          echo "Found $fork_count fork(s)."
          echo

          successes=0
          failures=0

          for repository in "${forks[@]}"; do
            echo "::group::Syncing $repository"

            if gh repo sync "$repository" --force; then
              echo "Successfully synced: $repository"
              successes=$((successes + 1))
            else
              echo "::error::Failed to sync: $repository"
              failures=$((failures + 1))
            fi

            echo "::endgroup::"
          done

          echo
          echo "Synchronization summary"
          echo "-----------------------"
          echo "Forks found: $fork_count"
          echo "Successful:  $successes"
          echo "Failed:      $failures"

          if (( failures > 0 )); then
            exit 1
          fi
