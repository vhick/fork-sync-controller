name: Universal Fork Sync

# This workflow ONLY updates GitHub forks. It NEVER runs portable builders.
on:
  schedule:
    # Every six hours (UTC), matching your original workflow.
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      force_sync:
        description: 'DANGER: overwrite conflicting changes in fork branches?'
        type: boolean
        default: false
        required: false

# The separate FORK_SYNC_TOKEN is used for access to all your forks.
permissions:
  contents: read

concurrency:
  group: universal-fork-sync
  cancel-in-progress: false

jobs:
  sync-forks:
    name: Automatically discover and sync all my forks
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}
      FORCE_SYNC: ${{ inputs.force_sync || 'false' }}

    steps:
      - name: Find all forks and sync their existing upstream branches
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo '::error::FORK_SYNC_TOKEN secret is missing.'
            exit 1
          fi
          gh auth status >/dev/null
          owner="$(gh api user --jq '.login')"
          if [[ -z "$owner" ]]; then
            echo '::error::Cannot identify the GitHub account for FORK_SYNC_TOKEN.'
            exit 1
          fi

          temp="$(mktemp -d)"
          trap 'rm -rf "$temp"' EXIT

          # Pagination means new forks are found automatically, even beyond 100 repos.
          # Include public and private forks accessible to FORK_SYNC_TOKEN.
          gh api --paginate 'user/repos?affiliation=owner&per_page=100' \
            --jq '.[] | select(.fork == true and .archived == false and .disabled == false) | .full_name' \
            > "$temp/forks.txt"

          total="$(wc -l < "$temp/forks.txt" | tr -d ' ')"
          echo "Account: $owner"
          echo "Active forks found: $total"
          echo "Force overwrite: $FORCE_SYNC"

          {
            echo '## Universal Fork Sync'
            echo ''
            echo "- GitHub account: \`$owner\`"
            echo "- Active forks discovered: **$total**"
            echo "- Force overwrite enabled: **$FORCE_SYNC**"
            echo '- Portable builders launched: **0**'
            echo ''
            echo '| Fork | Original developer repo | Synced branches | Failed branches | Result |'
            echo '|---|---|---:|---:|---|'
          } >> "$GITHUB_STEP_SUMMARY"

          if (( total == 0 )); then
            echo 'No accessible, active forks were found.'
            exit 0
          fi

          repo_ok=0
          repo_failed=0
          branch_ok=0
          branch_failed=0

          # Each discovered fork is processed separately, so one error does not
          # prevent the others from being updated.
          while IFS= read -r fork; do
            [[ -n "$fork" ]] || continue
            echo "::group::Fork $fork"

            # GitHub tells us the original repository: no repository names to maintain.
            if ! upstream="$(gh api "repos/$fork" --jq '.parent.full_name // empty')"; then
              echo "::error::Could not inspect parent for $fork"
              repo_failed=$((repo_failed + 1))
              echo "| \`$fork\` | Unknown | 0 | 1 | Failed: no parent metadata |" >> "$GITHUB_STEP_SUMMARY"
              echo '::endgroup::'
              continue
            fi
            if [[ -z "$upstream" ]]; then
              echo "::warning::Skipping $fork: original repository was removed or is inaccessible."
              repo_failed=$((repo_failed + 1))
              echo "| \`$fork\` | Unavailable | 0 | 1 | Skipped |" >> "$GITHUB_STEP_SUMMARY"
              echo '::endgroup::'
              continue
            fi
            echo "Original developer repository: $upstream"

            # GitHub forks may have a different main/master/develop branch.
            # Sync every branch already present in BOTH the fork and its parent.
            # This is generic and covers OBS master or MarkText develop without
            # hard-coding either application or branch name.
            if ! gh api --paginate "repos/$fork/branches?per_page=100" \
                  --jq '.[].name' > "$temp/fork-branches.txt" || \
               ! gh api --paginate "repos/$upstream/branches?per_page=100" \
                  --jq '.[].name' > "$temp/upstream-branches.txt"; then
              echo "::error::Cannot list branches for $fork or $upstream"
              repo_failed=$((repo_failed + 1))
              echo "| \`$fork\` | \`$upstream\` | 0 | 1 | Failed: branch listing |" >> "$GITHUB_STEP_SUMMARY"
              echo '::endgroup::'
              continue
            fi

            # Intersection, not union: never create arbitrary new branches.
            comm -12 \
              <(LC_ALL=C sort -u "$temp/fork-branches.txt") \
              <(LC_ALL=C sort -u "$temp/upstream-branches.txt") \
              > "$temp/shared-branches.txt"

            synced_this=0
            failed_this=0
            while IFS= read -r branch; do
              [[ -n "$branch" ]] || continue
              echo "Syncing $fork @ $branch from $upstream ..."

              if [[ "$FORCE_SYNC" == 'true' ]]; then
                if gh repo sync "$fork" --source "$upstream" --branch "$branch" --force; then
                  synced_this=$((synced_this + 1))
                else
                  echo "::error::Could not force-sync $fork @ $branch"
                  failed_this=$((failed_this + 1))
                fi
              else
                # Safe default: never overwrite a diverged or customized branch.
                if gh repo sync "$fork" --source "$upstream" --branch "$branch"; then
                  synced_this=$((synced_this + 1))
                else
                  echo "::warning::Could not fast-forward $fork @ $branch. A custom change, branch protection or token permission may be blocking sync."
                  failed_this=$((failed_this + 1))
                fi
              fi
            done < "$temp/shared-branches.txt"

            if (( synced_this == 0 && failed_this == 0 )); then
              echo "::warning::No common branches for $fork and $upstream."
              result='Skipped: no common branch'
              repo_failed=$((repo_failed + 1))
            elif (( failed_this > 0 )); then
              result='Partial / failed'
              repo_failed=$((repo_failed + 1))
            else
              result='OK'
              repo_ok=$((repo_ok + 1))
            fi
            branch_ok=$((branch_ok + synced_this))
            branch_failed=$((branch_failed + failed_this))
            echo "| \`$fork\` | \`$upstream\` | $synced_this | $failed_this | $result |" >> "$GITHUB_STEP_SUMMARY"
            echo '::endgroup::'
          done < "$temp/forks.txt"

          {
            echo ''
            echo "**Results:** $repo_ok forks OK, $repo_failed forks with errors/skips; $branch_ok branches synced/checked, $branch_failed branch errors."
            echo ''
            echo 'A successful sync updates source branches only. Run each portable builder manually from its own Actions tab.'
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Forks OK: $repo_ok; forks with issues: $repo_failed"
          echo "Branches synced/checked: $branch_ok; errors: $branch_failed"
          if (( repo_failed > 0 )); then
            exit 1
          fi
